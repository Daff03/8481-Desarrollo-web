<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi proyecto</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<!--    BREAKPOINTS
col-xs-* Menos de 768 px Teléfonos y anchos
pequeños
col-sm-* Desde 768 px Tablets
col-md-* Desde 992 px Escritorios medianos
col-lg-* Desde 1200 px Escritorios amplios
-->
<div class="container">
  <div class="row">
    <!-- col lg desde 1200 px-->
    <aside class="col-lg-3">
      Contenido secundario
    </aside>

    <main class="col-lg-9">
      Contenido principal   
    </main>

    <!-- 
    En móvil: ambos bloques ocupan 12/12 y se apilan.
    Desde tablet: la relación es 4/8.
    En escritorio amplio: la relación es 3/9
    -->
    <aside class="col-xs-12 col-sm-4 col-lg-3">
      Filtros, navegación o información secundaria
    </aside>
   
    <main class="col-xs-12 col-sm-8 col-lg-9">
      Contenido principal
    </main>
    
    <!-- Cuatro, dos o una tarjeta por fila según el ancho.-->
    <div class="row">
        <article class="col-xs-12 col-sm-6 col-lg-3">Tarjeta 1</article>
        <article class="col-xs-12 col-sm-6 col-lg-3">Tarjeta 2</article>
        <article class="col-xs-12 col-sm-6 col-lg-3">Tarjeta 3</article>
        <article class="col-xs-12 col-sm-6 col-lg-3">Tarjeta 4</article>
    </div>
    
 </div>
</div>

</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
