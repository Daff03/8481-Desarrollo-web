<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practica responsividad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <!-- Bloque Navbar de ancho completo -->
    <div class="row mb-1">
        <div class="bg-primary text-white col-12 p-2">Navbar</div>
    </div>

    <!-- Primera fila: Tres columnas iguales (4 + 4 + 4 = 12) -->
    <div class="row mb-1">
        <div class="bg-warning col-4 p-2">Izq</div>
        <div class="bg-secondary text-white col-4 p-2">Centro</div>
        <div class="bg-danger text-white col-4 p-2">Der</div>
    </div>

    <!-- Segunda fila: Dos columnas iguales (6 + 6 = 12) -->
    <div class="row">
        <div class="bg-primary text-white col-6 p-2">Izq</div>
        <div class="bg-warning col-6 p-2">Der</div>
    </div>
</div>

</body>
</html>
